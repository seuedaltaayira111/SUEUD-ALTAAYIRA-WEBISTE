<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>خدماتنا – صعود الطائرة</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet" />
  <style>
    /* ===== نفس الستايل من index.html ===== */
    * { margin:0; padding:0; box-sizing:border-box; }
    :root { --primary-dark:#061d3a; --gold:#d4af37; --gold-light:#f0d060; --gold-gradient:linear-gradient(135deg,#d4af37,#f5e56b); --glass-bg:rgba(255,255,255,0.04); --glass-border:rgba(255,255,255,0.06); --text-muted:rgba(255,255,255,0.6); --radius:20px; --font:'Tajawal',sans-serif; }
    html { scroll-behavior:smooth; }
    body { font-family:var(--font); background:var(--primary-dark); color:#f0f4ff; line-height:1.7; }
    body.rtl { direction:rtl; text-align:right; }
    body.ltr { direction:ltr; text-align:left; }
    a { text-decoration:none; color:inherit; }
    ul { list-style:none; }
    ::-webkit-scrollbar { width:7px; }
    ::-webkit-scrollbar-track { background:var(--primary-dark); }
    ::-webkit-scrollbar-thumb { background:var(--gold); border-radius:10px; }

    /* ===== HEADER (نفسه) ===== */
    .header { position:fixed; top:0; left:0; right:0; z-index:1000; padding:14px 0; background:rgba(6,29,58,0.94); backdrop-filter:blur(20px); border-bottom:1px solid rgba(212,175,55,0.1); }
    .header .container { display:flex; align-items:center; justify-content:space-between; max-width:1320px; margin:0 auto; padding:0 24px; }
    .logo { display:flex; align-items:center; gap:10px; font-size:1.5rem; font-weight:900; }
    .logo-icon { font-size:2rem; color:var(--gold); animation:logoFloat 3s ease-in-out infinite; }
    @keyframes logoFloat { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-4px);} }
    .logo-text { background:var(--gold-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .logo-sub { font-size:0.6rem; font-weight:300; color:var(--text-muted); display:block; margin-top:-3px; }
    .nav-links { display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
    .nav-links a { padding:8px 18px; border-radius:50px; font-size:0.9rem; font-weight:500; color:var(--text-muted); transition:0.3s; position:relative; }
    .nav-links a:hover, .nav-links a.active { color:#fff; background:rgba(212,175,55,0.1); }
    .nav-links a.active::after { content:''; position:absolute; bottom:4px; left:50%; transform:translateX(-50%); width:18px; height:2.5px; background:var(--gold); border-radius:4px; }
    .nav-cta { background:var(--gold-gradient) !important; color:var(--primary-dark) !important; font-weight:700 !important; padding:8px 26px !important; border-radius:50px !important; }
    .nav-cta:hover { transform:scale(1.05); }
    .lang-toggle { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); color:#fff; padding:6px 16px; border-radius:50px; font-weight:600; cursor:pointer; font-size:0.8rem; transition:0.3s; }
    .lang-toggle:hover { background:rgba(212,175,55,0.15); border-color:var(--gold); }
    .hamburger { display:none; flex-direction:column; gap:5px; cursor:pointer; padding:6px; z-index:1001; }
    .hamburger span { width:28px; height:2.5px; background:#fff; border-radius:4px; transition:0.3s; }
    .hamburger.active span:nth-child(1){transform:rotate(45deg) translate(5px,5px);}
    .hamburger.active span:nth-child(2){opacity:0; transform:scaleX(0);}
    .hamburger.active span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px);}
    @media (max-width:768px) {
      .nav-links { position:fixed; top:0; right:-100%; width:280px; height:100vh; background:rgba(6,29,58,0.97); flex-direction:column; padding:80px 28px 32px; transition:right 0.4s; border-left:1px solid rgba(255,255,255,0.04); }
      .nav-links.open { right:0; }
      .nav-links a { width:100%; padding:14px 18px; border-radius:12px; }
      .nav-links a.active::after { display:none; }
      .nav-cta { margin-top:8px; }
      .hamburger { display:flex; }
    }

    /* ===== SECTION ===== */
    .section { padding:130px 24px 80px; }
    .section .container { max-width:1320px; margin:0 auto; }
    .section-title { text-align:center; margin-bottom:48px; }
    .section-title h2 { font-size:clamp(2rem,4vw,3.2rem); font-weight:900; margin-bottom:8px; }
    .section-title h2 .highlight { background:var(--gold-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .section-title p { color:var(--text-muted); font-size:1.1rem; max-width:620px; margin:0 auto; }
    .section-divider { width:60px; height:3.5px; background:var(--gold-gradient); border-radius:4px; margin:14px auto 0; }

    /* ===== SERVICES GRID ===== */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 24px;
    }
    .service-card {
      padding: 28px 20px;
      border-radius: var(--radius);
      background: rgba(255,255,255,0.025);
      border: 1px solid rgba(255,255,255,0.04);
      text-align: center;
      cursor: pointer;
      transition: 0.4s;
      position: relative;
      overflow: hidden;
    }
    .service-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(212,175,55,0.05), transparent 60%);
      opacity: 0;
      transition: 0.4s;
    }
    .service-card:hover::before { opacity: 1; }
    .service-card:hover {
      transform: translateY(-12px);
      border-color: rgba(212,175,55,0.2);
      background: rgba(255,255,255,0.05);
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }
    .service-card .icon { font-size: 2.8rem; color: var(--gold); margin-bottom: 10px; display: inline-block; transition: 0.4s; }
    .service-card:hover .icon { transform: scale(1.15) rotate(-4deg); }
    .service-card h4 { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; }
    .service-card p { color: var(--text-muted); font-size: 0.8rem; margin-bottom: 10px; }
    .service-card .service-tag {
      display: inline-block;
      padding: 2px 12px;
      border-radius: 50px;
      background: rgba(212,175,55,0.08);
      color: var(--gold-light);
      font-size: 0.65rem;
      border: 1px solid rgba(212,175,55,0.06);
    }

    /* ===== SERVICE MODAL ===== */
    .service-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(12px);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .service-modal.open { display: flex; animation: modalFade 0.4s ease; }
    @keyframes modalFade { from{opacity:0;transform:scale(0.95);} to{opacity:1;transform:scale(1);} }
    .service-modal .modal-content {
      background: #0a1a2e;
      border-radius: 24px;
      max-width: 700px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 30px 80px rgba(0,0,0,0.6);
      padding: 0;
      position: relative;
    }
    .service-modal .modal-content .close-btn {
      position: sticky;
      top: 12px;
      left: 16px;
      float: left;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      transition: 0.3s;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 12px 12px 0 0;
    }
    .service-modal .modal-content .close-btn:hover { background:rgba(255,0,0,0.2); border-color:#ff4444; transform:rotate(90deg); }
    .service-modal .modal-body { padding: 0 30px 30px; }
    .service-modal .modal-body .service-img {
      width: 100%;
      height: 200px;
      background-size: cover;
      background-position: center;
      border-radius: 16px;
      margin-bottom: 20px;
    }
    .service-modal .modal-body h2 { font-size: 1.8rem; font-weight: 800; color: var(--gold); margin-bottom: 8px; }
    .service-modal .modal-body .service-desc { color: var(--text-muted); font-size: 1rem; margin-bottom: 16px; line-height: 1.8; }
    .service-modal .modal-body .service-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .service-modal .modal-body .service-details .detail-item {
      background: rgba(255,255,255,0.03);
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.04);
    }
    .service-modal .modal-body .service-details .detail-item span { color: var(--gold); font-weight: 600; display: block; font-size: 0.8rem; }
    .service-modal .modal-body .service-details .detail-item p { color: var(--text-muted); font-size: 0.9rem; }
    .service-modal .modal-body .form-group { margin-bottom: 16px; }
    .service-modal .modal-body .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; }
    .service-modal .modal-body .form-group input,
    .service-modal .modal-body .form-group select,
    .service-modal .modal-body .form-group textarea {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: 0.3s;
    }
    .service-modal .modal-body .form-group input:focus,
    .service-modal .modal-body .form-group select:focus,
    .service-modal .modal-body .form-group textarea:focus {
      border-color: var(--gold);
      background: rgba(255,255,255,0.06);
    }
    .service-modal .modal-body .form-group textarea { height: 80px; resize: vertical; }
    .service-modal .modal-body .btn-submit-service {
      width: 100%;
      padding: 14px;
      border-radius: 60px;
      background: var(--gold-gradient);
      color: var(--primary-dark);
      font-weight: 700;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      transition: 0.3s;
      font-family: inherit;
    }
    .service-modal .modal-body .btn-submit-service:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(212,175,55,0.3); }
    .service-modal .modal-body .form-status { margin-top: 12px; text-align: center; font-size: 0.9rem; min-height: 28px; }

    /* ===== FOOTER ===== */
    .footer { padding:60px 24px 30px; border-top:1px solid rgba(255,255,255,0.03); background:rgba(6,29,58,0.5); backdrop-filter:blur(12px); }
    .footer .container { max-width:1320px; margin:0 auto; display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:40px; }
    .footer .brand p { color:var(--text-muted); font-size:0.9rem; max-width:340px; margin-top:8px; }
    .footer .brand .socials { display:flex; gap:10px; margin-top:16px; }
    .footer .brand .socials a { width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.05); display:flex; align-items:center; justify-content:center; color:var(--text-muted); transition:0.3s; }
    .footer .brand .socials a:hover { background:rgba(212,175,55,0.1); border-color:var(--gold); color:var(--gold); transform:translateY(-3px); }
    .footer h5 { font-size:1.05rem; font-weight:700; margin-bottom:14px; color:#fff; }
    .footer ul li { margin-bottom:6px; }
    .footer ul li a { color:var(--text-muted); font-size:0.9rem; transition:0.3s; }
    .footer ul li a:hover { color:var(--gold); padding-right:6px; }
    .footer-bottom { max-width:1320px; margin:40px auto 0; padding-top:20px; border-top:1px solid rgba(255,255,255,0.03); text-align:center; color:var(--text-muted); font-size:0.8rem; }
    .footer-bottom span { color:var(--gold); }

    /* ===== WHATSAPP FLOAT ===== */
    .whatsapp-float { position:fixed; bottom:28px; left:28px; z-index:9999; display:flex; flex-direction:column; align-items:center; gap:6px; }
    .whatsapp-float .wa-btn { width:68px; height:68px; border-radius:50%; background:#25d366; color:#fff; font-size:2.4rem; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 40px rgba(37,211,102,0.3); transition:0.3s; border:none; cursor:pointer; animation:waPulse 2.8s ease-in-out infinite; }
    .whatsapp-float .wa-btn:hover { transform:scale(1.1); }
    .whatsapp-float .wa-label { font-size:0.65rem; color:var(--text-muted); background:rgba(0,0,0,0.5); padding:3px 14px; border-radius:50px; backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,0.04); }
    @keyframes waPulse { 0%,100%{box-shadow:0 8px 40px rgba(37,211,102,0.3);} 50%{box-shadow:0 8px 60px rgba(37,211,102,0.55),0 0 0 12px rgba(37,211,102,0.06);} }

    /* ===== AI CHAT ===== */
    .ai-chat-toggle { position:fixed; bottom:100px; right:28px; z-index:9998; width:60px; height:60px; border-radius:50%; background:linear-gradient(135deg,#6c3ce0,#a855f7); color:#fff; font-size:1.8rem; border:none; cursor:pointer; box-shadow:0 8px 40px rgba(108,60,224,0.35); transition:0.3s; animation:aiPulse 3s ease-in-out infinite; display:flex; align-items:center; justify-content:center; }
    .ai-chat-toggle:hover { transform:scale(1.1); }
    @keyframes aiPulse { 0%,100%{box-shadow:0 8px 40px rgba(108,60,224,0.35);} 50%{box-shadow:0 8px 60px rgba(108,60,224,0.55),0 0 0 12px rgba(108,60,224,0.06);} }
    .ai-chat-box { position:fixed; bottom:175px; right:28px; z-index:9997; width:380px; max-width:calc(100vw - 56px); max-height:500px; border-radius:24px; background:rgba(6,29,58,0.96); backdrop-filter:blur(30px); border:1px solid rgba(255,255,255,0.06); box-shadow:0 30px 80px rgba(0,0,0,0.6); display:none; flex-direction:column; overflow:hidden; }
    .ai-chat-box.open { display:flex; animation:chatSlideUp 0.4s ease; }
    @keyframes chatSlideUp { from{opacity:0;transform:translateY(30px) scale(0.96);} to{opacity:1;transform:translateY(0) scale(1);} }
    .ai-chat-header { padding:16px 20px; background:rgba(108,60,224,0.1); border-bottom:1px solid rgba(255,255,255,0.04); display:flex; align-items:center; justify-content:space-between; }
    .ai-chat-header .title { display:flex; align-items:center; gap:10px; font-weight:700; }
    .ai-chat-header .title i { color:#a855f7; }
    .ai-chat-header .close-btn { background:none; border:none; color:var(--text-muted); font-size:1.2rem; cursor:pointer; transition:0.3s; padding:4px; }
    .ai-chat-header .close-btn:hover { color:#fff; transform:rotate(90deg); }
    .ai-chat-messages { flex:1; padding:16px 18px; overflow-y:auto; max-height:320px; display:flex; flex-direction:column; gap:10px; }
    .ai-chat-messages .msg { padding:10px 16px; border-radius:16px; max-width:85%; font-size:0.9rem; line-height:1.6; animation:msgPop 0.3s ease; }
    @keyframes msgPop { from{opacity:0;transform:scale(0.92);} to{opacity:1;transform:scale(1);} }
    .ai-chat-messages .msg.bot { background:rgba(108,60,224,0.12); border:1px solid rgba(108,60,224,0.08); align-self:flex-start; border-bottom-right-radius:4px; }
    .ai-chat-messages .msg.user { background:rgba(212,175,55,0.08); border:1px solid rgba(212,175,55,0.06); align-self:flex-end; border-bottom-left-radius:4px; }
    .ai-chat-messages .msg .time { font-size:0.6rem; color:var(--text-muted); margin-top:4px; display:block; opacity:0.5; }
    .ai-chat-input { padding:12px 16px 16px; border-top:1px solid rgba(255,255,255,0.04); display:flex; gap:10px; }
    .ai-chat-input input { flex:1; padding:10px 16px; border-radius:50px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); color:#fff; font-family:inherit; font-size:0.9rem; outline:none; }
    .ai-chat-input input:focus { border-color:#a855f7; }
    .ai-chat-input button { padding:10px 20px; border-radius:50px; border:none; background:linear-gradient(135deg,#6c3ce0,#a855f7); color:#fff; font-weight:700; cursor:pointer; transition:0.3s; font-family:inherit; }
    .ai-chat-input button:hover { transform:scale(1.04); }

    @media (max-width:768px) {
      .service-modal .modal-body { padding:0 16px 20px; }
      .service-modal .modal-body .service-img { height:160px; }
      .service-modal .modal-body .service-details { grid-template-columns:1fr; }
      .ai-chat-box { width:calc(100vw - 32px); right:16px; bottom:155px; }
      .ai-chat-toggle { right:16px; bottom:85px; width:50px; height:50px; font-size:1.4rem; }
    }
    @media (max-width:480px) {
      .services-grid { grid-template-columns:1fr; }
      .section { padding:56px 16px; }
    }
  </style>
</head>
<body>
  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="container">
      <a href="index.html" class="logo">
        <span class="logo-icon">✈️</span>
        <span><span class="logo-text">صعود الطائرة</span><span class="logo-sub">للسفر والسياحة</span></span>
      </a>
      <nav class="nav-links" id="navLinks">
        <a href="index.html">الرئيسية</a>
        <a href="services.html" class="active">خدماتنا</a>
        <a href="offers.html">عروض</a>
        <a href="hotels.html">فنادق</a>
        <a href="packages.html">باقات</a>
        <a href="railway.html">قطارات</a>
        <a href="contact.html">اتصل بنا</a>
        <a href="contact.html" class="nav-cta">📞 احجز الآن</a>
      </nav>
      <div style="display:flex; align-items:center; gap:12px;">
        <button class="lang-toggle" id="langToggle">🇬🇧 EN</button>
        <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
      </div>
    </div>
  </header>

  <!-- ===== SERVICES ===== -->
  <section class="section">
    <div class="container">
      <div class="section-title">
        <h2>خدماتنا <span class="highlight">المتكاملة</span></h2>
        <p>اختر الخدمة التي تحتاجها، واحصل على عرض مخصص – كل خدمة لها نموذج حجز خاص بها</p>
        <div class="section-divider"></div>
      </div>
      <div class="services-grid" id="servicesGrid"></div>
    </div>
  </section>

  <!-- ===== SERVICE MODAL ===== -->
  <div class="service-modal" id="serviceModal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeServiceModal()"><i class="fas fa-times"></i></button>
      <div class="modal-body" id="serviceModalBody"></div>
    </div>
  </div>

  <!-- ===== WHATSAPP FLOAT ===== -->
  <div class="whatsapp-float">
    <a href="https://wa.me/966555382038?text=مرحباً%20أرغب%20في%20الاستفسار" target="_blank" class="wa-btn"><i class="fab fa-whatsapp"></i></a>
    <span class="wa-label">تواصل واتساب</span>
  </div>

  <!-- ===== AI CHAT ===== -->
  <button class="ai-chat-toggle" onclick="toggleAIChat()"><i class="fas fa-robot"></i></button>
  <div class="ai-chat-box" id="aiChatBox">
    <div class="ai-chat-header">
      <div class="title"><i class="fas fa-robot"></i> مساعد صعود الطائرة AI</div>
      <button class="close-btn" onclick="toggleAIChat()"><i class="fas fa-times"></i></button>
    </div>
    <div class="ai-chat-messages" id="aiChatMessages">
      <div class="msg bot">👋 مرحباً! أنا مساعد صعود الطائرة الذكي. كيف يمكنني مساعدتك اليوم؟<span class="time">الآن</span></div>
    </div>
    <div class="ai-chat-input">
      <input type="text" id="aiChatInput" placeholder="اكتب سؤالك هنا..." onkeypress="if(event.key==='Enter') sendAIMessage()" />
      <button onclick="sendAIMessage()"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>

  <script>
    // ===== HAMBURGER =====
    const hamburger = document.getElementById('hamburger');
    const navLinks = document.getElementById('navLinks');
    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('active');
      navLinks.classList.toggle('open');
    });
    document.querySelectorAll('.nav-links a').forEach(link => {
      link.addEventListener('click', () => {
        hamburger.classList.remove('active');
        navLinks.classList.remove('open');
      });
    });

    // ===== SERVICES DATA =====
    const servicesData = [
      { id:'flights', icon:'✈️', name:'تذاكر طيران', desc:'أرخص أسعار تذاكر الطيران مع أفضل شركات الطيران العالمية', img:'https://images.unsplash.com/photo-1436491865332-7a61a109cc05?w=600&h=400&fit=crop',
        details:['أكثر من 500 شركة طيران','أسعار مخفضة تصل إلى 40%','حجز سريع وآمن','إلغاء وتعديل مجاني'],
        questions:['مدينة المغادرة','مدينة الوصول','تاريخ السفر','عدد المسافرين','درجة السفر'] },
      { id:'umrah', icon:'🕋', name:'باقات العمرة', desc:'باقات عمرة متكاملة بأسعار تنافسية وخدمات فندقية مميزة', img:'https://images.unsplash.com/photo-1580587771525-78b9dba3b914?w=600&h=400&fit=crop',
        details:['تأشيرة عمرة','سكن قريب من الحرم','مواصلات داخلية','وجبات فاخرة','مرشد سياحي'],
        questions:['عدد الأشخاص','مدة الإقامة','نوع السكن','هل تريد مرشد سياحي؟'] },
      { id:'visa', icon:'🛂', name:'التأشيرات', desc:'تأشيرات سياحة، عمل، زيارة، علاج، وعمرة لكافة الدول', img:'https://images.unsplash.com/photo-1554224155-6726b3ff858f?w=600&h=400&fit=crop',
        details:['جميع أنواع التأشيرات','معالجة سريعة','أسعار تنافسية','دعم كامل'],
        questions:['نوع التأشيرة','الدولة المطلوبة','مدة الإقامة','عدد الأشخاص'] },
      { id:'hotels', icon:'🏨', name:'حجز الفنادق', desc:'أفضل العروض على الفنادق الفاخرة والاقتصادية حول العالم', img:'https://images.unsplash.com/photo-1566073771259-6a8506099945?w=600&h=400&fit=crop',
        details:['أكثر من 200 فندق','عروض حصرية','إلغاء مجاني','تقييمات العملاء'],
        questions:['المدينة','عدد الليالي','عدد الغرف','عدد الأشخاص'] },
      { id:'cars', icon:'🚗', name:'تأجير السيارات', desc:'سيارات فاخرة واقتصادية بأسعار مميزة مع تأمين شامل', img:'https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?w=600&h=400&fit=crop',
        details:['جميع فئات السيارات','تأمين شامل','توصيل للمطار','أسعار تنافسية'],
        questions:['المدينة','نوع السيارة','مدة التأجير','هل تريد توصيل للمطار؟'] },
      { id:'packages', icon:'🏝️', name:'باقات سياحية', desc:'عطلات شاملة في أجمل وجهات العالم بأسعار لا تُقاوم', img:'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600&h=400&fit=crop',
        details:['أكثر من 200 باقة','وجهات عالمية','شاملة الطيران والفندق','عروض خاصة'],
        questions:['الوجهة','عدد الأشخاص','مدة الرحلة','نوع الباقة'] },
      { id:'railway', icon:'🚆', name:'حجز القطارات', desc:'حجز تذاكر القطارات (السكك الحديدية) بأسعار مخفضة', img:'https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?w=600&h=400&fit=crop',
        details:['جميع خطوط القطارات','أسعار مخفضة','حجز سريع','إلغاء مرن'],
        questions:['مدينة المغادرة','مدينة الوصول','تاريخ السفر','عدد المسافرين'] },
      { id:'bus', icon:'🚌', name:'حجز الباصات', desc:'رحلات برية مريحة بأفضل الأسعار على شبكات الباصات', img:'https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?w=600&h=400&fit=crop',
        details:['جميع خطوط الباصات','أسعار تنافسية','حجز سريع'],
        questions:['مدينة المغادرة','مدينة الوصول','تاريخ السفر','عدد المسافرين'] },
      { id:'airport', icon:'✈️', name:'نقل المطار', desc:'خدمة استقبال وتوديع من وإلى المطار بسيارات حديثة', img:'https://images.unsplash.com/photo-1436491865332-7a61a109cc05?w=600&h=400&fit=crop',
        details:['سيارات حديثة','سائقين محترفين','تتبع الرحلة','أسعار ثابتة'],
        questions:['المطار','نوع السيارة','عدد الركاب','وقت الاستقبال'] },
      { id:'insurance', icon:'🛡️', name:'تأمين السفر', desc:'تأمين شامل يغطي المخاطر الطبية، إلغاء الرحلات، وفقدان الأمتعة', img:'https://images.unsplash.com/photo-1450101499163-c8848c66ca85?w=600&h=400&fit=crop',
        details:['تغطية طبية شاملة','تعويض إلغاء الرحلات','تأمين الأمتعة','دعم 24/7'],
        questions:['نوع التأمين','مدة السفر','الوجهة','عدد المسافرين'] }
    ];

    const servicesGrid = document.getElementById('servicesGrid');
    servicesData.forEach((s, i) => {
      const card = document.createElement('div');
      card.className = 'service-card';
      card.style.transitionDelay = `${i * 0.05}s`;
      card.innerHTML = `
        <div class="icon">${s.icon}</div>
        <h4>${s.name}</h4>
        <p>${s.desc}</p>
        <span class="service-tag">احجز الآن</span>
      `;
      card.addEventListener('click', () => openService(s.id));
      servicesGrid.appendChild(card);
    });

    // ===== SERVICE MODAL =====
    function openService(serviceId) {
      const service = servicesData.find(s => s.id === serviceId) || servicesData[0];
      const modal = document.getElementById('serviceModal');
      const body = document.getElementById('serviceModalBody');

      let formFields = '';
      service.questions.forEach((q, i) => {
        const name = `q_${i}`;
        const isDate = q.includes('تاريخ') || q.includes('التاريخ');
        const isSelect = q.includes('نوع') || q.includes('درجة');
        if (isSelect && q.includes('درجة')) {
          formFields += `
            <div class="form-group">
              <label>${q}</label>
              <select name="${name}" required>
                <option value="">اختر...</option>
                <option value="اقتصادي">اقتصادي</option>
                <option value="أعمال">أعمال</option>
                <option value="أولى">أولى</option>
              </select>
            </div>
          `;
        } else if (isSelect) {
          formFields += `
            <div class="form-group">
              <label>${q}</label>
              <select name="${name}" required>
                <option value="">اختر...</option>
                <option value="نعم">نعم</option>
                <option value="لا">لا</option>
              </select>
            </div>
          `;
        } else if (isDate) {
          formFields += `
            <div class="form-group">
              <label>${q}</label>
              <input type="date" name="${name}" required />
            </div>
          `;
        } else if (q.includes('عدد') || q.includes('مدة')) {
          formFields += `
            <div class="form-group">
              <label>${q}</label>
              <input type="number" name="${name}" placeholder="أدخل الرقم" required min="1" />
            </div>
          `;
        } else {
          formFields += `
            <div class="form-group">
              <label>${q}</label>
              <input type="text" name="${name}" placeholder="أدخل ${q}" required />
            </div>
          `;
        }
      });

      body.innerHTML = `
        <div class="service-img" style="background-image:url('${service.img}');"></div>
        <h2>${service.icon} ${service.name}</h2>
        <div class="service-desc">${service.desc}</div>
        <div class="service-details">
          ${service.details.map(d => `
            <div class="detail-item">
              <span>✓</span>
              <p>${d}</p>
            </div>
          `).join('')}
        </div>
        <h3 style="color:var(--gold);margin:16px 0 12px;font-size:1.2rem;">📋 نموذج الحجز</h3>
        <form id="serviceForm">
          <div class="form-group">
            <label>الاسم الكامل</label>
            <input type="text" name="fullname" placeholder="أدخل اسمك الكامل" required />
          </div>
          <div class="form-group">
            <label>رقم الجوال</label>
            <input type="tel" name="phone" placeholder="أدخل رقم جوالك" required />
          </div>
          <div class="form-group">
            <label>البريد الإلكتروني</label>
            <input type="email" name="email" placeholder="أدخل بريدك الإلكتروني" />
          </div>
          ${formFields}
          <div class="form-group">
            <label>ملاحظات إضافية</label>
            <textarea name="notes" placeholder="أي تفاصيل إضافية..."></textarea>
          </div>
          <button type="submit" class="btn-submit-service"><i class="fab fa-whatsapp"></i> إرسال الطلب عبر واتساب</button>
          <div class="form-status" id="serviceFormStatus"></div>
        </form>
      `;

      modal.classList.add('open');
      document.body.style.overflow = 'hidden';

      const form = document.getElementById('serviceForm');
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        const formData = new FormData(form);
        const serviceName = service.name;
        let msg = `📩 طلب حجز جديد - خدمة: ${serviceName}\n\n`;
        for (const [key, value] of formData.entries()) {
          if (value && value.trim()) {
            const label = key === 'fullname' ? 'الاسم' :
              key === 'phone' ? 'الجوال' :
              key === 'email' ? 'البريد' :
              key === 'notes' ? 'ملاحظات' :
              document.querySelector(`[name="${key}"]`)?.previousElementSibling?.textContent || key;
            msg += `${label}: ${value}\n`;
          }
        }
        const status = document.getElementById('serviceFormStatus');
        status.textContent = '✅ جاري التحويل إلى واتساب ...';
        status.style.color = '#4ade80';
        setTimeout(() => {
          window.open(`https://wa.me/966555382038?text=${encodeURIComponent(msg)}`, '_blank');
          status.textContent = '✅ تم إرسال الطلب بنجاح!';
          setTimeout(() => { closeServiceModal(); }, 1500);
        }, 700);
      });
    }

    function closeServiceModal() {
      document.getElementById('serviceModal').classList.remove('open');
      document.body.style.overflow = 'auto';
    }
    document.getElementById('serviceModal').addEventListener('click', function(e) {
      if (e.target === this) closeServiceModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeServiceModal();
    });

    // ===== AI CHAT (نفس الكود من index) =====
    const chatBox = document.getElementById('aiChatBox');
    const chatMessages = document.getElementById('aiChatMessages');
    const chatInput = document.getElementById('aiChatInput');
    const aiResponses = {
      'مرحبا':'👋 أهلاً بك! لدينا عروض خاصة بمناسبة اليوم الوطني بخصم يصل إلى 93%!',
      'عمرة':'🕋 باقات العمرة لدينا تبدأ من ١٢٠٠ ريال.',
      'تذكرة':'✈️ نوفر أرخص تذاكر الطيران بأسعار تبدأ من 179 ريال.',
      'فندق':'🏨 لدينا أكثر من 200 فندق بأسعار حقيقية.',
      'عرض':'🔥 عروض اليوم الوطني: خصم 93% على الفنادق!',
      'شكرا':'🙏 العفو! سعداء بمساعدتك.'
    };
    const defaultReplies = ['🤖 شكراً! سيقوم فريقنا بالتواصل.', '📱 اتصل بنا على واتساب 0555382038.', '🌍 اكتشف عروضنا في قسم العروض!'];
    function getAIResponse(text) {
      const lower = text.toLowerCase().trim();
      for (const [key, response] of Object.entries(aiResponses)) {
        if (lower.includes(key)) return response;
      }
      return defaultReplies[Math.floor(Math.random() * defaultReplies.length)];
    }
    window.toggleAIChat = function() {
      chatBox.classList.toggle('open');
      if (chatBox.classList.contains('open')) chatInput.focus();
    };
    function addMessage(type, text) {
      const msg = document.createElement('div');
      msg.className = `msg ${type}`;
      const time = new Date().toLocaleTimeString('ar-SA', { hour:'2-digit', minute:'2-digit' });
      msg.innerHTML = `${text}<span class="time">${time}</span>`;
      chatMessages.appendChild(msg);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }
    window.sendAIMessage = function() {
      const text = chatInput.value.trim();
      if (!text) return;
      addMessage('user', text);
      chatInput.value = '';
      const typing = document.createElement('div');
      typing.className = 'msg bot';
      typing.innerHTML = '🤖 جاري التفكير...';
      typing.id = 'typingIndicator';
      chatMessages.appendChild(typing);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      setTimeout(() => {
        document.getElementById('typingIndicator')?.remove();
        addMessage('bot', getAIResponse(text));
      }, 500 + Math.random() * 400);
    };

    // ===== LANGUAGE TOGGLE =====
    const langToggle = document.getElementById('langToggle');
    let currentLang = 'ar';
    function applyLanguage(lang) {
      currentLang = lang;
      document.body.className = lang === 'ar' ? 'rtl' : 'ltr';
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      langToggle.textContent = lang === 'ar' ? '🇬🇧 EN' : '🇸🇦 عربي';
      localStorage.setItem('lang', lang);
    }
    langToggle.addEventListener('click', () => {
      applyLanguage(currentLang === 'ar' ? 'en' : 'ar');
    });
    applyLanguage(localStorage.getItem('lang') || 'ar');
  </script>
</body>
</html>
