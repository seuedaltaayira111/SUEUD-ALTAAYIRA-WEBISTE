<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    /* ===== جميع الأنماط العامة (نفس الأنماط السابقة) ===== */
    /* اختصاراً، سأضع الأنماط الأساسية هنا، لكن يمكنك نسخ الأنماط الكاملة من الملف السابق */
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Tajawal',sans-serif; background:#061d3a; color:#f0f4ff; overflow-x:hidden; }
    :root { --gold:#d4af37; --gold-light:#f0d060; --gold-gradient:linear-gradient(135deg,#d4af37,#f5e56b,#d4af37); --primary-dark:#061d3a; --text-muted:rgba(255,255,255,0.6); }
    /* ... باقي الأنماط كما في الملف السابق ... */
    /* ويمكنك إضافة أنماط خاصة بـ Planner */
    .planner-box { background:rgba(255,255,255,0.03); border-radius:20px; padding:30px; border:1px solid rgba(255,255,255,0.06); margin-top:40px; }
    .planner-box h3 { color:var(--gold); margin-bottom:12px; }
    .planner-box select, .planner-box input { width:100%; padding:12px; margin-bottom:12px; border-radius:12px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); color:#fff; font-family:inherit; }
    .planner-box .btn-planner { background:var(--gold-gradient); color:#061d3a; font-weight:700; padding:12px 30px; border:none; border-radius:50px; cursor:pointer; width:100%; }
    #plannerResult { margin-top:16px; padding:16px; background:rgba(212,175,55,0.08); border-radius:12px; border:1px solid rgba(212,175,55,0.1); display:none; }
  </style>
</head>
<body>
  <!-- ===== HEADER (نفسه في كل الصفحات) ===== -->
  <header class="header" id="header"> ... </header>
  <!-- يمكنك نسخ الهيدر من الملف السابق، وسأختصره هنا -->
  
  <!-- ===== HERO ===== -->
  <section class="hero" id="home"> ... </section>

  <!-- ===== AI TRIP PLANNER (ميزة فريدة) ===== -->
  <section class="section" style="padding-top:20px;">
    <div class="container">
      <div class="section-title reveal">
        <h2>مخطط رحلتك <span class="highlight">الذكي</span></h2>
        <p>أجب عن بضعة أسئلة وسيوصي لك مساعدنا الذكي بأفضل وجهة وخط سير</p>
        <div class="section-divider"></div>
      </div>
      <div class="planner-box reveal">
        <h3><i class="fas fa-robot" style="color:var(--gold);"></i> خطط لرحلتك المثالية</h3>
        <div class="form-group">
          <label>الميزانية (ريال)</label>
          <input type="number" id="budget" placeholder="مثل: 5000" />
        </div>
        <div class="form-group">
          <label>الاهتمامات (اختر)</label>
          <select id="interest">
            <option value="culture">ثقافة وتاريخ</option>
            <option value="beach">شواطئ وبحر</option>
            <option value="nature">طبيعة ومغامرات</option>
            <option value="luxury">فخامة وتسوق</option>
            <option value="family">عائلي</option>
          </select>
        </div>
        <div class="form-group">
          <label>مدة الرحلة (ليالي)</label>
          <input type="number" id="nights" placeholder="مثل: 5" />
        </div>
        <button class="btn-planner" onclick="planTrip()"><i class="fas fa-magic"></i> احصل على توصية</button>
        <div id="plannerResult"></div>
      </div>
    </div>
  </section>

  <!-- ===== باقي المحتوى (خدمات، باقات، سيارات، عن الوكالة، اتصال) ===== -->
  <!-- يمكنك تضمينها من الملف السابق ولكن بشكل مختصر -->
  
  <!-- ===== FOOTER ===== -->
  <footer class="footer"> ... </footer>

  <!-- ===== FLOATING WHATSAPP ===== -->
  <div class="whatsapp-float"> ... </div>

  <script>
    // ===== AI TRIP PLANNER (خوارزمية توصية ذكية) =====
    function planTrip() {
      const budget = parseInt(document.getElementById('budget').value) || 0;
      const interest = document.getElementById('interest').value;
      const nights = parseInt(document.getElementById('nights').value) || 0;
      const resultDiv = document.getElementById('plannerResult');
      
      if (budget < 1000 || nights < 1) {
        resultDiv.innerHTML = '⚠️ يرجى إدخال ميزانية (أكثر من ١٠٠٠ ريال) وعدد ليالي صحيح.';
        resultDiv.style.display = 'block';
        return;
      }

      let recommendation = '';
      let destinations = [];
      
      // خوارزمية بسيطة بناءً على المدخلات
      if (interest === 'culture') {
        destinations = ['اسطنبول (تركيا)', 'القاهرة (مصر)', 'أصفهان (إيران)'];
      } else if (interest === 'beach') {
        destinations = ['جدة (السعودية)', 'شرم الشيخ (مصر)', 'باتايا (تايلاند)'];
      } else if (interest === 'nature') {
        destinations = ['نيوم (السعودية)', 'كيب تاون (جنوب أفريقيا)', 'سويسرا'];
      } else if (interest === 'luxury') {
        destinations = ['دبي (الإمارات)', 'باريس (فرنسا)', 'لندن (بريطانيا)'];
      } else if (interest === 'family') {
        destinations = ['أورلاندو (أمريكا)', 'كوالالمبور (ماليزيا)', 'أنطاليا (تركيا)'];
      }
      
      // ترشيح حسب الميزانية
      let best = destinations[0];
      if (budget > 15000 && nights > 5) best = destinations[1] || best;
      if (budget > 25000 && nights > 7) best = destinations[2] || best;
      
      recommendation = `
        <h4 style="color:var(--gold);">✈️ بناءً على اختياراتك، نوصي بـ <strong>${best}</strong></h4>
        <p style="color:var(--text-muted);">مدة الرحلة: ${nights} ليالي | الميزانية: ${budget} ريال</p>
        <p style="color:var(--text-muted);">يمكنك التواصل معنا للحصول على عرض مفصل لهذه الوجهة.</p>
        <a href="https://wa.me/966555382038?text=مرحباً%20أرغب%20في%20تفاصيل%20عن%20${encodeURIComponent(best)}" target="_blank" class="btn-whatsapp" style="display:inline-block;padding:10px 24px;border-radius:50px;background:#25d366;color:#fff;margin-top:12px;text-decoration:none;">
          <i class="fab fa-whatsapp"></i> احجز الآن
        </a>
      `;
      resultDiv.innerHTML = recommendation;
      resultDiv.style.display = 'block';
    }
  </script>
</body>
</html>
