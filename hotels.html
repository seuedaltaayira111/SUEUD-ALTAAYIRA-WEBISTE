<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>فنادق – صعود الطائرة</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet" />
  <style>
    /* ===== نفس الستايل من services.html ===== */
    * { margin:0; padding:0; box-sizing:border-box; }
    :root { --primary-dark:#061d3a; --gold:#d4af37; --gold-light:#f0d060; --gold-gradient:linear-gradient(135deg,#d4af37,#f5e56b); --glass-bg:rgba(255,255,255,0.04); --glass-border:rgba(255,255,255,0.06); --text-muted:rgba(255,255,255,0.6); --radius:20px; --font:'Tajawal',sans-serif; }
    html { scroll-behavior:smooth; }
    body { font-family:var(--font); background:var(--primary-dark); color:#f0f4ff; line-height:1.7; }
    body.rtl { direction:rtl; text-align:right; }
    body.ltr { direction:ltr; text-align:left; }
    a { text-decoration:none; color:inherit; }
    ul { list-style:none; }
    ::-webkit-scrollbar { width:7px; }
    ::-webkit-scrollbar-track { background:var(--primary-dark); }
    ::-webkit-scrollbar-thumb { background:var(--gold); border-radius:10px; }

    /* ===== HEADER (نفسه) ===== */
    .header { position:fixed; top:0; left:0; right:0; z-index:1000; padding:14px 0; background:rgba(6,29,58,0.94); backdrop-filter:blur(20px); border-bottom:1px solid rgba(212,175,55,0.1); }
    .header .container { display:flex; align-items:center; justify-content:space-between; max-width:1320px; margin:0 auto; padding:0 24px; }
    .logo { display:flex; align-items:center; gap:10px; font-size:1.5rem; font-weight:900; }
    .logo-icon { font-size:2rem; color:var(--gold); animation:logoFloat 3s ease-in-out infinite; }
    @keyframes logoFloat { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-4px);} }
    .logo-text { background:var(--gold-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .logo-sub { font-size:0.6rem; font-weight:300; color:var(--text-muted); display:block; margin-top:-3px; }
    .nav-links { display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
    .nav-links a { padding:8px 18px; border-radius:50px; font-size:0.9rem; font-weight:500; color:var(--text-muted); transition:0.3s; position:relative; }
    .nav-links a:hover, .nav-links a.active { color:#fff; background:rgba(212,175,55,0.1); }
    .nav-links a.active::after { content:''; position:absolute; bottom:4px; left:50%; transform:translateX(-50%); width:18px; height:2.5px; background:var(--gold); border-radius:4px; }
    .nav-cta { background:var(--gold-gradient) !important; color:var(--primary-dark) !important; font-weight:700 !important; padding:8px 26px !important; border-radius:50px !important; }
    .nav-cta:hover { transform:scale(1.05); }
    .lang-toggle { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); color:#fff; padding:6px 16px; border-radius:50px; font-weight:600; cursor:pointer; font-size:0.8rem; transition:0.3s; }
    .lang-toggle:hover { background:rgba(212,175,55,0.15); border-color:var(--gold); }
    .hamburger { display:none; flex-direction:column; gap:5px; cursor:pointer; padding:6px; z-index:1001; }
    .hamburger span { width:28px; height:2.5px; background:#fff; border-radius:4px; transition:0.3s; }
    .hamburger.active span:nth-child(1){transform:rotate(45deg) translate(5px,5px);}
    .hamburger.active span:nth-child(2){opacity:0; transform:scaleX(0);}
    .hamburger.active span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px);}
    @media (max-width:768px) {
      .nav-links { position:fixed; top:0; right:-100%; width:280px; height:100vh; background:rgba(6,29,58,0.97); flex-direction:column; padding:80px 28px 32px; transition:right 0.4s; border-left:1px solid rgba(255,255,255,0.04); }
      .nav-links.open { right:0; }
      .nav-links a { width:100%; padding:14px 18px; border-radius:12px; }
      .nav-links a.active::after { display:none; }
      .nav-cta { margin-top:8px; }
      .hamburger { display:flex; }
    }

    /* ===== SECTION ===== */
    .section { padding:130px 24px 80px; }
    .section .container { max-width:1320px; margin:0 auto; }
    .section-title { text-align:center; margin-bottom:48px; }
    .section-title h2 { font-size:clamp(2rem,4vw,3.2rem); font-weight:900; margin-bottom:8px; }
    .section-title h2 .highlight { background:var(--gold-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .section-title p { color:var(--text-muted); font-size:1.1rem; max-width:620px; margin:0 auto; }
    .section-divider { width:60px; height:3.5px; background:var(--gold-gradient); border-radius:4px; margin:14px auto 0; }

    /* ===== HOTELS GRID ===== */
    .hotels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 28px;
    }
    .hotel-card {
      background: rgba(255,255,255,0.025);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: var(--radius);
      overflow: hidden;
      transition: 0.4s;
    }
    .hotel-card:hover {
      transform: translateY(-8px);
      border-color: rgba(212,175,55,0.15);
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }
    .hotel-card .img {
      height: 170px;
      background-size: cover;
      background-position: center;
    }
    .hotel-card .body { padding: 18px 20px 22px; }
    .hotel-card .body h4 { font-size: 1.1rem; font-weight: 800; }
    .hotel-card .body .location { color: var(--gold); font-size: 0.8rem; }
    .hotel-card .body .rating { color: #fbbf24; font-size: 0.85rem; margin: 4px 0; }
    .hotel-card .body .price { color: var(--gold); font-size: 1.1rem; font-weight: 700; }
    .hotel-card .body .price small { font-size: 0.65rem; color: var(--text-muted); font-weight: 400; }
    .hotel-card .body .btn-sm {
      padding: 8px 22px;
      border-radius: 50px;
      font-size: 0.8rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      background: var(--gold-gradient);
      color: var(--primary-dark);
      margin-top: 10px;
      transition: 0.3s;
      font-family: inherit;
    }
    .hotel-card .body .btn-sm:hover { transform: scale(1.05); }

    /* ===== LOAD MORE ===== */
    .load-more-btn {
      display: block;
      margin: 30px auto 0;
      padding: 12px 40px;
      border-radius: 60px;
      background: var(--gold-gradient);
      color: var(--primary-dark);
      font-weight: 700;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.3s;
      font-family: inherit;
    }
    .load-more-btn:hover { transform: scale(1.05); box-shadow: 0 8px 30px rgba(212,175,55,0.25); }

    /* ===== FOOTER ===== */
    .footer { padding:60px 24px 30px; border-top:1px solid rgba(255,255,255,0.03); background:rgba(6,29,58,0.5); backdrop-filter:blur(12px); }
    .footer .container { max-width:1320px; margin:0 auto; display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:40px; }
    .footer .brand p { color:var(--text-muted); font-size:0.9rem; max-width:340px; margin-top:8px; }
    .footer .brand .socials { display:flex; gap:10px; margin-top:16px; }
    .footer .brand .socials a { width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.05); display:flex; align-items:center; justify-content:center; color:var(--text-muted); transition:0.3s; }
    .footer .brand .socials a:hover { background:rgba(212,175,55,0.1); border-color:var(--gold); color:var(--gold); transform:translateY(-3px); }
    .footer h5 { font-size:1.05rem; font-weight:700; margin-bottom:14px; color:#fff; }
    .footer ul li { margin-bottom:6px; }
    .footer ul li a { color:var(--text-muted); font-size:0.9rem; transition:0.3s; }
    .footer ul li a:hover { color:var(--gold); padding-right:6px; }
    .footer-bottom { max-width:1320px; margin:40px auto 0; padding-top:20px; border-top:1px solid rgba(255,255,255,0.03); text-align:center; color:var(--text-muted); font-size:0.8rem; }
    .footer-bottom span { color:var(--gold); }

    /* ===== WHATSAPP FLOAT ===== */
    .whatsapp-float { position:fixed; bottom:28px; left:28px; z-index:9999; display:flex; flex-direction:column; align-items:center; gap:6px; }
    .whatsapp-float .wa-btn { width:68px; height:68px; border-radius:50%; background:#25d366; color:#fff; font-size:2.4rem; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 40px rgba(37,211,102,0.3); transition:0.3s; border:none; cursor:pointer; animation:waPulse 2.8s ease-in-out infinite; }
    .whatsapp-float .wa-btn:hover { transform:scale(1.1); }
    .whatsapp-float .wa-label { font-size:0.65rem; color:var(--text-muted); background:rgba(0,0,0,0.5); padding:3px 14px; border-radius:50px; backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,0.04); }
    @keyframes waPulse { 0%,100%{box-shadow:0 8px 40px rgba(37,211,102,0.3);} 50%{box-shadow:0 8px 60px rgba(37,211,102,0.55),0 0 0 12px rgba(37,211,102,0.06);} }

    /* ===== AI CHAT ===== */
    .ai-chat-toggle { position:fixed; bottom:100px; right:28px; z-index:9998; width:60px; height:60px; border-radius:50%; background:linear-gradient(135deg,#6c3ce0,#a855f7); color:#fff; font-size:1.8rem; border:none; cursor:pointer; box-shadow:0 8px 40px rgba(108,60,224,0.35); transition:0.3s; animation:aiPulse 3s ease-in-out infinite; display:flex; align-items:center; justify-content:center; }
    .ai-chat-toggle:hover { transform:scale(1.1); }
    @keyframes aiPulse { 0%,100%{box-shadow:0 8px 40px rgba(108,60,224,0.35);} 50%{box-shadow:0 8px 60px rgba(108,60,224,0.55),0 0 0 12px rgba(108,60,224,0.06);} }
    .ai-chat-box { position:fixed; bottom:175px; right:28px; z-index:9997; width:380px; max-width:calc(100vw - 56px); max-height:500px; border-radius:24px; background:rgba(6,29,58,0.96); backdrop-filter:blur(30px); border:1px solid rgba(255,255,255,0.06); box-shadow:0 30px 80px rgba(0,0,0,0.6); display:none; flex-direction:column; overflow:hidden; }
    .ai-chat-box.open { display:flex; animation:chatSlideUp 0.4s ease; }
    @keyframes chatSlideUp { from{opacity:0;transform:translateY(30px) scale(0.96);} to{opacity:1;transform:translateY(0) scale(1);} }
    .ai-chat-header { padding:16px 20px; background:rgba(108,60,224,0.1); border-bottom:1px solid rgba(255,255,255,0.04); display:flex; align-items:center; justify-content:space-between; }
    .ai-chat-header .title { display:flex; align-items:center; gap:10px; font-weight:700; }
    .ai-chat-header .title i { color:#a855f7; }
    .ai-chat-header .close-btn { background:none; border:none; color:var(--text-muted); font-size:1.2rem; cursor:pointer; transition:0.3s; padding:4px; }
    .ai-chat-header .close-btn:hover { color:#fff; transform:rotate(90deg); }
    .ai-chat-messages { flex:1; padding:16px 18px; overflow-y:auto; max-height:320px; display:flex; flex-direction:column; gap:10px; }
    .ai-chat-messages .msg { padding:10px 16px; border-radius:16px; max-width:85%; font-size:0.9rem; line-height:1.6; animation:msgPop 0.3s ease; }
    @keyframes msgPop { from{opacity:0;transform:scale(0.92);} to{opacity:1;transform:scale(1);} }
    .ai-chat-messages .msg.bot { background:rgba(108,60,224,0.12); border:1px solid rgba(108,60,224,0.08); align-self:flex-start; border-bottom-right-radius:4px; }
    .ai-chat-messages .msg.user { background:rgba(212,175,55,0.08); border:1px solid rgba(212,175,55,0.06); align-self:flex-end; border-bottom-left-radius:4px; }
    .ai-chat-messages .msg .time { font-size:0.6rem; color:var(--text-muted); margin-top:4px; display:block; opacity:0.5; }
    .ai-chat-input { padding:12px 16px 16px; border-top:1px solid rgba(255,255,255,0.04); display:flex; gap:10px; }
    .ai-chat-input input { flex:1; padding:10px 16px; border-radius:50px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); color:#fff; font-family:inherit; font-size:0.9rem; outline:none; }
    .ai-chat-input input:focus { border-color:#a855f7; }
    .ai-chat-input button { padding:10px 20px; border-radius:50px; border:none; background:linear-gradient(135deg,#6c3ce0,#a855f7); color:#fff; font-weight:700; cursor:pointer; transition:0.3s; font-family:inherit; }
    .ai-chat-input button:hover { transform:scale(1.04); }

    @media (max-width:768px) {
      .hotels-grid { grid-template-columns:1fr 1fr; }
      .ai-chat-box { width:calc(100vw - 32px); right:16px; bottom:155px; }
      .ai-chat-toggle { right:16px; bottom:85px; width:50px; height:50px; font-size:1.4rem; }
    }
    @media (max-width:480px) {
      .hotels-grid { grid-template-columns:1fr; }
      .section { padding:56px 16px; }
    }
  </style>
</head>
<body>
  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="container">
      <a href="index.html" class="logo">
        <span class="logo-icon">✈️</span>
        <span><span class="logo-text">صعود الطائرة</span><span class="logo-sub">للسفر والسياحة</span></span>
      </a>
      <nav class="nav-links" id="navLinks">
        <a href="index.html">الرئيسية</a>
        <a href="services.html">خدماتنا</a>
        <a href="offers.html">عروض</a>
        <a href="hotels.html" class="active">فنادق</a>
        <a href="packages.html">باقات</a>
        <a href="railway.html">قطارات</a>
        <a href="contact.html">اتصل بنا</a>
        <a href="contact.html" class="nav-cta">📞 احجز الآن</a>
      </nav>
      <div style="display:flex; align-items:center; gap:12px;">
        <button class="lang-toggle" id="langToggle">🇬🇧 EN</button>
        <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
      </div>
    </div>
  </header>

  <!-- ===== HOTELS ===== -->
  <section class="section">
    <div class="container">
      <div class="section-title">
        <h2>أفضل <span class="highlight">الفنادق</span></h2>
        <p>اختر من بين أكثر من 200 فندق حول العالم – إقامة فاخرة بأسعار حقيقية من Booking.com</p>
        <div class="section-divider"></div>
      </div>
      <div class="hotels-grid" id="hotelsGrid"></div>
      <button class="load-more-btn" id="loadMoreHotels">عرض المزيد من الفنادق</button>
    </div>
  </section>

  <!-- ===== WHATSAPP FLOAT ===== -->
  <div class="whatsapp-float">
    <a href="https://wa.me/966555382038?text=مرحباً%20أرغب%20في%20الاستفسار" target="_blank" class="wa-btn"><i class="fab fa-whatsapp"></i></a>
    <span class="wa-label">تواصل واتساب</span>
  </div>

  <!-- ===== AI CHAT ===== -->
  <button class="ai-chat-toggle" onclick="toggleAIChat()"><i class="fas fa-robot"></i></button>
  <div class="ai-chat-box" id="aiChatBox">
    <div class="ai-chat-header">
      <div class="title"><i class="fas fa-robot"></i> مساعد صعود الطائرة AI</div>
      <button class="close-btn" onclick="toggleAIChat()"><i class="fas fa-times"></i></button>
    </div>
    <div class="ai-chat-messages" id="aiChatMessages">
      <div class="msg bot">👋 مرحباً! أنا مساعد صعود الطائرة الذكي. كيف يمكنني مساعدتك اليوم؟<span class="time">الآن</span></div>
    </div>
    <div class="ai-chat-input">
      <input type="text" id="aiChatInput" placeholder="اكتب سؤالك هنا..." onkeypress="if(event.key==='Enter') sendAIMessage()" />
      <button onclick="sendAIMessage()"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>

  <script>
    // ===== HAMBURGER =====
    const hamburger = document.getElementById('hamburger');
    const navLinks = document.getElementById('navLinks');
    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('active');
      navLinks.classList.toggle('open');
    });
    document.querySelectorAll('.nav-links a').forEach(link => {
      link.addEventListener('click', () => {
        hamburger.classList.remove('active');
        navLinks.classList.remove('open');
      });
    });

    // ===== HOTELS DATA (200+) =====
    const hotelNames = ['فندق الفيرمونت','الريتز كارلتون','فور سيزونز','هيلتون','شيراتون','ماريوت','كيمبنسكي','ريتز باريس','جراند حياة','إنتركونتيننتال','ويستن','لو ميريديان','سوفيتيل','نوفوتيل','إيبيس','موفنبيك','راديسون بلو','كروان بلازا','دوسيت ثاني','شانغريلا','ماندارين أورينتال','أمان','بورتو','ميلينيوم'];
    const hotelCities = ['الرياض','جدة','مكة','المدينة','الدمام','الخبر','أبها','تبوك','حائل','القصيم'];
    const hotelImages = [
      'https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?w=400&h=250&fit=crop',
      'https://images.unsplash.com/photo-1566073771259-6a8506099945?w=400&h=250&fit=crop',
      'https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?w=400&h=250&fit=crop',
      'https://images.unsplash.com/photo-1551882547-ff40c63fe5fa?w=400&h=250&fit=crop',
      'https://images.unsplash.com/photo-1564501049412-61c2a3083791?w=400&h=250&fit=crop',
      'https://images.unsplash.com/photo-1520250497591-112f2f40a3f4?w=400&h=250&fit=crop'
    ];
    const cityPriceBase = { 'الرياض':1477, 'جدة':758, 'مكة':627, 'المدينة':550, 'الدمام':650, 'الخبر':600, 'أبها':500, 'تبوك':450, 'حائل':400, 'القصيم':420 };

    let allHotels = [];
    for (let i = 0; i < 200; i++) {
      const name = hotelNames[i % hotelNames.length] + (Math.floor(i / hotelNames.length) > 0 ? ` ${Math.floor(i / hotelNames.length) + 1}` : '');
      const city = hotelCities[i % hotelCities.length];
      const basePrice = cityPriceBase[city] || 700;
      const price = Math.round((basePrice * (0.7 + Math.random() * 0.6)) / 5) * 5;
      const rating = (4 + Math.random() * 1).toFixed(1);
      allHotels.push({ name, city, rating, price, img: hotelImages[i % hotelImages.length] });
    }

    let displayCount = 12;
    const hotelsGrid = document.getElementById('hotelsGrid');

    function renderHotels(count) {
      const toShow = allHotels.slice(0, count);
      hotelsGrid.innerHTML = '';
      toShow.forEach(h => {
        const card = document.createElement('div');
        card.className = 'hotel-card';
        card.innerHTML = `
          <div class="img" style="background-image:url('${h.img}');"></div>
          <div class="body">
            <h4>${h.name}</h4>
            <div class="location"><i class="fas fa-map-marker-alt"></i> ${h.city}</div>
            <div class="rating">${'★'.repeat(Math.floor(h.rating))}${h.rating % 1 >= 0.5 ? '½' : ''} (${h.rating}) <i class="fas fa-star"></i></div>
            <div class="price">${h.price} ر.س <small>/ ليلة</small></div>
            <button class="btn-sm" onclick="bookHotel('${h.name}','${h.city}',${h.price})"><i class="fas fa-calendar-check"></i> احجز الآن</button>
          </div>
        `;
        hotelsGrid.appendChild(card);
      });
    }

    renderHotels(displayCount);

    document.getElementById('loadMoreHotels').addEventListener('click', function() {
      displayCount += 12;
      if (displayCount >= allHotels.length) this.style.display = 'none';
      renderHotels(displayCount);
    });

    window.bookHotel = function(name, city, price) {
      const msg = `🏨 حجز فندق\nالفندق: ${name}\nالمدينة: ${city}\nالسعر: ${price} ر.س/ليلة`;
      window.open(`https://wa.me/966555382038?text=${encodeURIComponent(msg)}`, '_blank');
    };

    // ===== AI CHAT =====
    const chatBox = document.getElementById('aiChatBox');
    const chatMessages = document.getElementById('aiChatMessages');
    const chatInput = document.getElementById('aiChatInput');
    const aiResponses = {
      'مرحبا':'👋 أهلاً بك! لدينا أكثر من 200 فندق بأسعار حقيقية.',
      'فندق':'🏨 لدينا فنادق في الرياض، جدة، مكة، والمدينة بأسعار تنافسية.',
      'عرض':'🔥 عروض اليوم الوطني: خصم يصل إلى 93% على الفنادق!',
      'شكرا':'🙏 العفو! سعداء بمساعدتك.'
    };
    const defaultReplies = ['🤖 شكراً! سيقوم فريقنا بالتواصل.', '📱 اتصل بنا على واتساب 0555382038.', '🏨 اكتشف فنادقنا الرائعة في الأعلى!'];
    function getAIResponse(text) {
      const lower = text.toLowerCase().trim();
      for (const [key, response] of Object.entries(aiResponses)) {
        if (lower.includes(key)) return response;
      }
      return defaultReplies[Math.floor(Math.random() * defaultReplies.length)];
    }
    window.toggleAIChat = function() {
      chatBox.classList.toggle('open');
      if (chatBox.classList.contains('open')) chatInput.focus();
    };
    function addMessage(type, text) {
      const msg = document.createElement('div');
      msg.className = `msg ${type}`;
      const time = new Date().toLocaleTimeString('ar-SA', { hour:'2-digit', minute:'2-digit' });
      msg.innerHTML = `${text}<span class="time">${time}</span>`;
      chatMessages.appendChild(msg);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }
    window.sendAIMessage = function() {
      const text = chatInput.value.trim();
      if (!text) return;
      addMessage('user', text);
      chatInput.value = '';
      const typing = document.createElement('div');
      typing.className = 'msg bot';
      typing.innerHTML = '🤖 جاري التفكير...';
      typing.id = 'typingIndicator';
      chatMessages.appendChild(typing);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      setTimeout(() => {
        document.getElementById('typingIndicator')?.remove();
        addMessage('bot', getAIResponse(text));
      }, 500 + Math.random() * 400);
    };

    // ===== LANGUAGE TOGGLE =====
    const langToggle = document.getElementById('langToggle');
    let currentLang = 'ar';
    function applyLanguage(lang) {
      currentLang = lang;
      document.body.className = lang === 'ar' ? 'rtl' : 'ltr';
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      langToggle.textContent = lang === 'ar' ? '🇬🇧 EN' : '🇸🇦 عربي';
      localStorage.setItem('lang', lang);
    }
    langToggle.addEventListener('click', () => {
      applyLanguage(currentLang === 'ar' ? 'en' : 'ar');
    });
    applyLanguage(localStorage.getItem('lang') || 'ar');
  </script>
</body>
</html>
